name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name antbeeacr

      - name: Build Docker image
        run: docker build -t antbeeacr.azurecr.io/ant-bee-api:${{ github.sha }} .

      - name: Push Docker image
        run: docker push antbeeacr.azurecr.io/ant-bee-api:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ant-bee-test \
            --resource-group test1 \
            --image antbeeacr.azurecr.io/ant-bee-api:${{ github.sha }}